<script type="text/plain" id="src-garden">
// --- Night Garden: words circle a lamp like moths, in four turning rings ---

let corpus = `
moths gather where the jasmine opens after midnight.
the dark garden breathes through every folded petal.
a lantern hums beneath the slow vine of sleep.
dew remembers the shape of every hidden root.
the moon pours milk across the quiet orchard.
night blossoms turn their pale faces toward the wall.
every seed keeps a small lantern underground.
the orchard listens to the moths in slow circles.
`;

let markov;
let words = [];
let ringAngles = [0, 0, 0, 0];
let ts = 20;
let changeTimer = 0;
const BASE_DURATION = 480;
const FADE_FRAMES = 70;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont("Georgia");
  markov = new MarkovGenerator(1);
  markov.train(corpus);
  setupAudio();
  generateStanza();
}

function draw() {
  background(12, 14, 18, 40);
  let { bass, treble, level } = readAudio();

  // Lamp glow at the center swells with the bass
  noStroke();
  fill(255, 214, 150, 8 + bass * 40);
  circle(width / 2, height / 2, 30 + bass * 90);

  // Each ring turns at its own pace; neighbours turn opposite ways.
  // Treble spins them faster.
  for (let r = 0; r < ringAngles.length; r++) {
    let dir = r % 2 === 0 ? 1 : -1;
    ringAngles[r] += dir * (0.0015 + r * 0.0004) * (1 + treble * 6);
  }

  let fading = changeTimer > BASE_DURATION - FADE_FRAMES;
  for (let w of words) {
    w.update(bass, level, fading);
    w.display();
  }

  changeTimer += 1 + level * 8;
  if (changeTimer > BASE_DURATION) {
    generateStanza();
    changeTimer = 0;
  }

  drawHint(230, 215, 190);
}

function generateStanza() {
  words = [];
  ts = constrain(min(width, height) / 36, 13, 22);
  textSize(ts);
  let maxR = min(width, height) * 0.44;

  // One line of the poem per ring, laid end to end around it
  for (let l = 0; l < 4; l++) {
    let radius = maxR * (0.32 + l * 0.22);
    let angle = random(TWO_PI);
    for (let word of markov.generateLine(4, 9).split(" ")) {
      let span = (textWidth(word) + textWidth("  ")) / radius;
      words.push(new OrbitWord(word, l, radius, angle + span / 2));
      angle += span;
    }
  }
}

class OrbitWord {
  constructor(word, ring, radius, angle) {
    this.word = word;
    this.ring = ring;
    this.radius = radius;
    this.angle = angle;
    this.pos = createVector(width / 2, height / 2); // bloom out from the lamp
    this.vel = createVector(0, 0);
    this.alpha = 0;
    this.baseAlpha = map(ring, 0, 3, 235, 150);
  }

  update(bass, level, fading) {
    // Home position on the ring; heavy bass widens every ring
    let a = this.angle + ringAngles[this.ring];
    let r = this.radius * (1 + bass * 0.25);
    let home = createVector(width / 2 + cos(a) * r, height / 2 + sin(a) * r);
    let acc = p5.Vector.sub(home, this.pos).mult(0.04);

    // The cursor is a second lamp: nearby words drift toward it
    let mouse = createVector(mouseX, mouseY);
    let d = p5.Vector.dist(this.pos, mouse);
    if (d < 160 && d > 1) {
      acc.add(p5.Vector.sub(mouse, this.pos).setMag(map(d, 0, 160, 2.5, 0)));
    }

    // Loud sounds scatter the moths outward
    if (level > 0.15) {
      let center = createVector(width / 2, height / 2);
      acc.add(p5.Vector.sub(this.pos, center).setMag(level * 6));
    }

    this.vel.add(acc);
    this.vel.mult(0.86);
    this.pos.add(this.vel);

    if (fading) this.alpha = max(0, this.alpha - 4);
    else if (this.alpha < this.baseAlpha) this.alpha += 4;
  }

  display() {
    push();
    noStroke();
    fill(240, 228, 205, this.alpha);
    textSize(ts);
    textAlign(CENTER, CENTER);
    text(this.word, this.pos.x, this.pos.y);
    pop();
  }
}

function mousePressed() {
  if (!startAudio()) {
    generateStanza();
    changeTimer = 0;
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  generateStanza();
}

// -------------------------------------------------------------
// Audio: reacts to the mic where p5.sound is loaded (the p5 web
// editor includes it); elsewhere the sketch runs on the mouse alone
// -------------------------------------------------------------
let mic, fft;
let audioStarted = false;
const HAS_SOUND = typeof p5.AudioIn === "function";

function setupAudio() {
  if (!HAS_SOUND) return;
  mic = new p5.AudioIn();
  fft = new p5.FFT(0.8, 64);
  fft.setInput(mic);
}

function readAudio() {
  if (!audioStarted) return { bass: 0, treble: 0, level: 0 };
  fft.analyze();
  return {
    bass: fft.getEnergy("bass") / 255,      // 0.0 - 1.0
    treble: fft.getEnergy("treble") / 255,  // 0.0 - 1.0
    level: mic.getLevel()                   // Amplitude volume
  };
}

// Browsers require a click before the microphone can start.
// Returns true if this click was used to start it.
function startAudio() {
  if (!HAS_SOUND || audioStarted) return false;
  userStartAudio();
  mic.start();
  audioStarted = true;
  return true;
}

function drawHint(r, g, b) {
  let msg = HAS_SOUND && !audioStarted
    ? "[ click to let the microphone in ]"
    : "[ click for a new stanza ]";
  push();
  noStroke();
  fill(r, g, b, 130);
  textSize(12);
  textAlign(CENTER);
  text(msg, width / 2, height - 30);
  pop();
}

// -------------------------------------------------------------
// Markov Chain Engine
// -------------------------------------------------------------
class MarkovGenerator {
  constructor(order = 1) {
    this.order = order;
    this.chain = {};
    this.starts = [];
  }

  train(text) {
    let sentences = text.trim().toLowerCase().split("\n");

    for (let s of sentences) {
      let tokens = s.trim().split(/\s+/).filter(t => t.length > 0);
      if (tokens.length <= this.order) continue;

      this.starts.push(tokens.slice(0, this.order).join(" "));

      for (let i = 0; i <= tokens.length - this.order; i++) {
        let gram = tokens.slice(i, i + this.order).join(" ");
        let next = tokens[i + this.order] || null;
        if (!this.chain[gram]) this.chain[gram] = [];
        if (next) this.chain[gram].push(next);
      }
    }
  }

  generateLine(minWords = 4, maxWords = 8) {
    if (this.starts.length === 0) return "silence unfolds";

    let result = random(this.starts).split(" ");

    while (result.length < maxWords) {
      let gram = result.slice(result.length - this.order).join(" ");
      let nextOptions = this.chain[gram];
      if (!nextOptions || nextOptions.length === 0) break;

      let nextWord = random(nextOptions);
      result.push(nextWord);
      if (nextWord.endsWith(".") && result.length >= minWords) break;
    }

    return result.join(" ").replace(/\./g, "");
  }
}

<script type="text/plain" id="src-rain">
// --- Rain Ledger: words fall like rain and settle into lines ---

let corpus = `
rain writes its ledger across the tin roofs of the city.
the gutter counts every coin of falling light.
a bus window holds the blurred names of strangers.
wet neon spills slowly down the empty avenue.
the umbrella keeps a small weather of its own.
puddles hold the sky folded at our feet.
the city rinses its windows before morning.
every streetlamp drowns a little gold in the street.
`;

let markov;
let words = [];
let streaks = [];
let ts = 20;
let changeTimer = 0;
const BASE_DURATION = 540;
const DRAIN_FRAMES = 90;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont("Georgia");
  markov = new MarkovGenerator(1);
  markov.train(corpus);
  setupAudio();
  makeStreaks();
  generateStanza();
}

function makeStreaks() {
  streaks = [];
  for (let i = 0; i < 90; i++) {
    streaks.push({ x: random(width), y: random(height), len: random(8, 22), speed: random(4, 9) });
  }
}

function draw() {
  background(16, 20, 26, 80);
  let { bass, treble, level } = readAudio();

  // Wind gusts with noise; treble blows harder
  let wind = (noise(frameCount * 0.004) - 0.5) * 2 + treble * 3;

  // Background rain
  stroke(150, 170, 195, 45);
  strokeWeight(1);
  for (let s of streaks) {
    line(s.x, s.y, s.x + wind * 2, s.y + s.len);
    s.y += s.speed * (1 + level * 3);
    s.x += wind;
    if (s.y > height) { s.y = -20; s.x = random(width); }
    if (s.x > width) s.x -= width;
    if (s.x < 0) s.x += width;
  }

  let draining = changeTimer > BASE_DURATION - DRAIN_FRAMES;
  for (let w of words) {
    w.update(bass, level, wind, draining);
    w.display();
  }

  // Thunder flash on loud sounds
  if (level > 0.2) {
    noStroke();
    fill(200, 215, 235, level * 60);
    rect(0, 0, width, height);
  }

  changeTimer += 1 + level * 8;
  if (changeTimer > BASE_DURATION) {
    generateStanza();
    changeTimer = 0;
  }

  drawHint(180, 195, 215);
}

function generateStanza() {
  words = [];
  ts = constrain(width / 40, 14, 22);
  textSize(ts);
  let lineHeight = ts * 2.2;
  let startY = height * 0.32;

  for (let l = 0; l < 4; l++) {
    let lineStr = markov.generateLine(4, 9);
    let curX = max(16, (width - textWidth(lineStr)) / 2);
    let lineWords = lineStr.split(" ");
    for (let i = 0; i < lineWords.length; i++) {
      let delay = l * 25 + i * 6 + floor(random(10)); // a staggered downpour
      words.push(new RainWord(lineWords[i], curX, startY + l * lineHeight, delay));
      curX += textWidth(lineWords[i] + " ");
    }
  }
}

class RainWord {
  constructor(word, tx, ty, delay) {
    this.word = word;
    this.target = createVector(tx, ty);
    this.pos = createVector(tx + random(-40, 40), -random(30, 200));
    this.vel = createVector(0, 0);
    this.delay = delay;
    this.landed = false;
  }

  update(bass, level, wind, draining) {
    if (this.delay > 0) { this.delay--; return; }

    // When the stanza drains, the floor drops away and words fall off-screen
    let floor = draining ? height + 80 : this.target.y;

    this.vel.y += 0.35 + bass * 0.3; // gravity, heavier with bass

    // Wind pushes sideways; a spring brings each word back over its place
    this.vel.x += wind * 0.08 + (this.target.x - this.pos.x) * 0.02;

    // The cursor is an umbrella: words falling onto it slide off the sides
    let dx = this.pos.x - mouseX;
    let dy = this.pos.y - mouseY;
    if (abs(dx) < 70 && dy < 0 && dy > -110) {
      this.vel.x += (dx >= 0 ? 1 : -1) * 1.2;
    }

    // Thunder throws settled words back into the air
    if (level > 0.2 && this.landed) {
      this.vel.y = -random(4, 10) * level * 4;
      this.landed = false;
    }

    this.vel.x *= 0.9;
    this.pos.add(this.vel);

    if (this.pos.y >= floor) {
      this.pos.y = floor;
      if (this.vel.y > 1.5) {
        this.vel.y *= -0.3; // small splash bounce
      } else {
        this.vel.y = 0;
        this.landed = true;
      }
    }
  }

  display() {
    if (this.delay > 0) return;
    push();
    noStroke();
    fill(215, 225, 238, 225);
    textSize(ts);
    text(this.word, this.pos.x, this.pos.y);
    pop();
  }
}

function mousePressed() {
  if (!startAudio()) {
    generateStanza();
    changeTimer = 0;
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeStreaks();
  generateStanza();
}

<script type="text/plain" id="src-archive">
// --- Archive: each stanza types itself out, then scrolls up and fades ---

let corpus = `
the archive keeps a drawer for every unsent letter.
ink fades slowly on the backs of old receipts.
a typewriter remembers the weight of each confession.
the clerk files the rain under forgotten names.
paper yellows in the long silence of the basement.
every envelope holds the dust of another city.
the ribbon ran out halfway through the apology.
old stamps carry small kings across the sea.
`;

let markov;
let stanzas = [];   // the current stanza is last; older ones are scrolling away
let ts = 18;
let charBudget = 0;
let holdTimer = 0;
const HOLD_FRAMES = 260;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont("Courier New");
  markov = new MarkovGenerator(1);
  markov.train(corpus);
  setupAudio();
  newStanza();
}

function draw() {
  background(236, 228, 212); // paper
  let { bass, treble, level } = readAudio();

  // Type a few characters per frame; loud sounds make the typist hurry
  let current = stanzas[stanzas.length - 1];
  charBudget += 0.4 + level * 3;
  while (charBudget >= 1 && !current.done()) {
    current.typeChar();
    charBudget -= 1;
  }
  if (current.done()) {
    holdTimer++;
    if (holdTimer > HOLD_FRAMES) newStanza();
  }

  for (let s of stanzas) {
    s.update();
    s.display(bass, treble);
  }
  stanzas = stanzas.filter(s => s.alpha > 0);

  drawHint(60, 50, 40);
}

function newStanza() {
  // The previous stanza rolls up out of the way like paper through a platen
  for (let s of stanzas) s.leave();
  stanzas.push(new Stanza());
  holdTimer = 0;
  charBudget = 0;
}

class Stanza {
  constructor() {
    ts = constrain(width / 42, 13, 19);
    textSize(ts);
    this.lineHeight = ts * 1.9;
    this.left = max(20, (width - 640) / 2);
    this.top = height * 0.3;
    this.scroll = 0;
    this.scrollTarget = 0;
    this.alpha = 255;
    this.leaving = false;
    this.tokens = [];
    this.typed = 0; // index of the token being typed

    // Lay words out left-aligned, wrapping at the right margin
    let y = 0;
    for (let l = 0; l < 4; l++) {
      let x = 0;
      for (let word of markov.generateLine(4, 9).split(" ")) {
        let w = textWidth(word);
        if (x > 0 && this.left + x + w > width - 20) {
          x = textWidth("  "); // wrapped lines are indented
          y += this.lineHeight;
        }
        this.tokens.push({ word, x, y, shown: 0, scramble: word });
        x += w + textWidth(" ");
      }
      y += this.lineHeight;
    }
    this.height = y;
  }

  done() {
    return this.typed >= this.tokens.length;
  }

  typeChar() {
    let t = this.tokens[this.typed];
    t.shown++;
    if (t.shown > t.word.length) this.typed++; // the extra step is the space bar
  }

  leave() {
    this.leaving = true;
    this.scrollTarget = -(this.height + this.lineHeight * 2);
  }

  update() {
    this.scroll += (this.scrollTarget - this.scroll) * 0.06;
    if (this.leaving) this.alpha -= 2.5;
  }

  display(bass, treble) {
    push();
    noStroke();
    textSize(ts);
    for (let t of this.tokens) {
      if (t.shown === 0) continue;
      let x = this.left + t.x + random(-1, 1) * treble * 2; // key-strike shimmy
      let y = this.top + t.y + this.scroll + random(-1, 1) * bass * 3;
      let str = t.word.slice(0, t.shown);

      // Words near the cursor smudge: letters jumble in ribbon red
      let near = !this.leaving && t.shown >= t.word.length &&
        dist(mouseX, mouseY, x + textWidth(t.word) / 2, y - ts / 3) < 60;
      if (near) {
        if (frameCount % 8 === 0) t.scramble = shuffle(t.word.split("")).join("");
        fill(168, 50, 43, this.alpha);
        str = t.scramble;
      } else {
        fill(42, 38, 34, this.alpha);
      }
      text(str, x, y);
    }

    // Blinking carriage cursor after the last typed letter
    if (!this.leaving && !this.done() && frameCount % 40 < 22) {
      let t = this.tokens[this.typed];
      let cx = this.left + t.x + textWidth(t.word.slice(0, t.shown));
      fill(42, 38, 34, 200);
      rect(cx + 1, this.top + t.y + this.scroll + 3, ts * 0.55, 2);
    }
    pop();
  }
}

function mousePressed() {
  if (!startAudio()) newStanza();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  stanzas = [];
  newStanza();
}

      let gram = result.slice(result.length - this.order).join(" ");
      let nextOptions = this.chain[gram];
      if (!nextOptions || nextOptions.length === 0) break;

      let nextWord = random(nextOptions);
      result.push(nextWord);
      if (nextWord.endsWith(".") && result.length >= minWords) break;
    }

    return result.join(" ").replace(/\./g, "");
  }
}
</script>
<script type="text/plain" id="src-stars">
// --- Star Chart: each line of the poem becomes a constellation ---

let corpus = `
the old star leans its silver weight on the dark.
a comet threads the needle of the northern sky.
every orbit returns to the quiet of its first door.
the telescope gathers light older than the sea.
cold dust drifts between the patient planets.
the dark keeps a ledger of every burning name.
a satellite hums above the sleeping fields.
the northern sky remembers a lantern made of ice.
`;

let markov;
let constellations = []; // arrays of StarWord, in reading order
let sky = [];
let ts = 16;
let changeTimer = 0;
const BASE_DURATION = 560;
const FADE_FRAMES = 80;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont("Georgia");
  markov = new MarkovGenerator(1);
  markov.train(corpus);
  setupAudio();
  makeSky();
  generateStanza();
}

function makeSky() {
  sky = [];
  for (let i = 0; i < 220; i++) {
    sky.push({ x: random(width), y: random(height), s: random(0.5, 2), phase: random(TWO_PI) });
  }
}

function draw() {
  background(6, 8, 18);
  let { bass, treble, level } = readAudio();

  // Background stars twinkle faster with treble
  noStroke();
  for (let st of sky) {
    let tw = 110 + 90 * sin(frameCount * 0.03 * (1 + treble * 4) + st.phase);
    fill(200, 210, 255, tw);
    circle(st.x, st.y, st.s);
  }

  let fading = changeTimer > BASE_DURATION - FADE_FRAMES;

  for (let c of constellations) {
    // Hovering any star lights up its whole constellation
    let lit = c.some(w => dist(mouseX, mouseY, w.pos.x, w.pos.y) < 90);
    for (let w of c) w.update(bass, level, fading, lit);

    stroke(150, 175, 240, (lit ? 150 : 55) * c[0].alpha / 255);
    strokeWeight(1);
    for (let i = 1; i < c.length; i++) {
      line(c[i - 1].pos.x, c[i - 1].pos.y, c[i].pos.x, c[i].pos.y);
    }
    for (let w of c) w.display(bass, lit);
  }

  changeTimer += 1 + level * 8;
  if (changeTimer > BASE_DURATION) {
    generateStanza();
    changeTimer = 0;
  }

  drawHint(170, 185, 230);
}

function generateStanza() {
  constellations = [];
  ts = constrain(min(width, height) / 45, 12, 17);
  textSize(ts);

  // Four regions of sky: a 2x2 grid when wide, a column when narrow
  let regions = [];
  if (width >= 700) {
    for (let cy of [0.3, 0.7]) for (let cx of [0.27, 0.73]) {
      regions.push({ x: width * cx, y: height * cy, rx: width * 0.18, ry: height * 0.15 });
    }
  } else {
    for (let cy of [0.18, 0.4, 0.62, 0.84]) {
      regions.push({ x: width / 2, y: height * cy, rx: width * 0.32, ry: height * 0.07 });
    }
  }
  regions = shuffle(regions);

  for (let l = 0; l < 4; l++) {
    let r = regions[l];
    let p = createVector(r.x + random(-r.rx, r.rx) * 0.5, r.y + random(-r.ry, r.ry) * 0.5);
    let c = [];
    for (let word of markov.generateLine(4, 8).split(" ")) {
      c.push(new StarWord(word, p.copy()));
      // Wander to the next star, staying inside this region
      let step = textWidth(word) * 0.6 + random(25, 55);
      p.add(p5.Vector.fromAngle(random(TWO_PI)).mult(step));
      p.x = constrain(p.x, r.x - r.rx, r.x + r.rx);
      p.y = constrain(p.y, r.y - r.ry, r.y + r.ry);
    }
    constellations.push(c);
  }
}

class StarWord {
  constructor(word, home) {
    this.word = word;
    this.home = home;
    this.pos = home.copy().add(random(-20, 20), random(-20, 20));
    this.vel = createVector(0, 0);
    this.alpha = 0;
    this.seed = random(1000);
    this.flare = 0;
  }

  update(bass, level, fading, lit) {
    // Slow celestial drift around home
    let drift = createVector(
      (noise(this.seed, frameCount * 0.003) - 0.5) * 30,
      (noise(this.seed + 50, frameCount * 0.003) - 0.5) * 30
    );
    let acc = p5.Vector.add(this.home, drift).sub(this.pos).mult(0.02);

    // Loud sounds set off a supernova: a few stars flare and fly
    if (level > 0.18 && random() < 0.03) {
      this.vel.add(p5.Vector.random2D().mult(level * 20));
      this.flare = 255;
    }

    this.vel.add(acc);
    this.vel.mult(0.9);
    this.pos.add(this.vel);
    this.flare *= 0.94;

    let target = lit ? 255 : 190;
    if (fading) this.alpha = max(0, this.alpha - 4);
    else this.alpha += (target - this.alpha) * 0.05;
  }

  display(bass, lit) {
    push();
    noStroke();
    // The star itself pulses with the bass
    fill(255, 245, 220, this.alpha);
    circle(this.pos.x, this.pos.y, 3 + bass * 6 + this.flare / 40);
    fill(lit ? 235 : 200, lit ? 225 : 210, 255, this.alpha);
    textSize(ts * (1 + bass * 0.3));
    text(this.word, this.pos.x + 7, this.pos.y + ts * 0.35);
    pop();
  }
}

function mousePressed() {
  if (!startAudio()) {
    generateStanza();
    changeTimer = 0;
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeSky();
  generateStanza();
}

// -------------------------------------------------------------
// Audio: reacts to the mic where p5.sound is loaded (the p5 web
// editor includes it); elsewhere the sketch runs on the mouse alone
// -------------------------------------------------------------
let mic, fft;
let audioStarted = false;
const HAS_SOUND = typeof p5.AudioIn === "function";

function setupAudio() {
  if (!HAS_SOUND) return;
  mic = new p5.AudioIn();
  fft = new p5.FFT(0.8, 64);
  fft.setInput(mic);
}

function readAudio() {
  if (!audioStarted) return { bass: 0, treble: 0, level: 0 };
  fft.analyze();
  return {
    bass: fft.getEnergy("bass") / 255,      // 0.0 - 1.0
    treble: fft.getEnergy("treble") / 255,  // 0.0 - 1.0
    level: mic.getLevel()                   // Amplitude volume
  };
}

// Browsers require a click before the microphone can start.
// Returns true if this click was used to start it.
function startAudio() {
  if (!HAS_SOUND || audioStarted) return false;
  userStartAudio();
  mic.start();
  audioStarted = true;
  return true;
}

function drawHint(r, g, b) {
  let msg = HAS_SOUND && !audioStarted
    ? "[ click to let the microphone in ]"
    : "[ click for a new stanza ]";
  push();
  noStroke();
  fill(r, g, b, 130);
  textSize(12);
  textAlign(CENTER);
  text(msg, width / 2, height - 30);
  pop();
}

// -------------------------------------------------------------
// Markov Chain Engine
// -------------------------------------------------------------
class MarkovGenerator {
  constructor(order = 1) {
    this.order = order;
    this.chain = {};
    this.starts = [];
  }

  train(text) {
    let sentences = text.trim().toLowerCase().split("\n");

    for (let s of sentences) {
      let tokens = s.trim().split(/\s+/).filter(t => t.length > 0);
      if (tokens.length <= this.order) continue;

      this.starts.push(tokens.slice(0, this.order).join(" "));

      for (let i = 0; i <= tokens.length - this.order; i++) {
        let gram = tokens.slice(i, i + this.order).join(" ");
        let next = tokens[i + this.order] || null;
        if (!this.chain[gram]) this.chain[gram] = [];
        if (next) this.chain[gram].push(next);
      }
    }
  }

  generateLine(minWords = 4, maxWords = 8) {
    if (this.starts.length === 0) return "silence unfolds";

    let result = random(this.starts).split(" ");

    while (result.length < maxWords) {
      let gram = result.slice(result.length - this.order).join(" ");
      let nextOptions = this.chain[gram];
      if (!nextOptions || nextOptions.length === 0) break;

      let nextWord = random(nextOptions);
      result.push(nextWord);
      if (nextWord.endsWith(".") && result.length >= minWords) break;
    }

    return result.join(" ").replace(/\./g, "");
  }
}
</script>

  for (const a of document.querySelectorAll("#tabs a")) {
    if (a.dataset.name === pick) a.setAttribute("aria-current", "page");
  }
